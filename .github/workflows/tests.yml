name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run the quick start
        run: python examples/quickstart.py
      - name: Rebuild figures and numbers from the saved raw arrays
        run: MPLBACKEND=Agg python experiments/run_all.py --plot
